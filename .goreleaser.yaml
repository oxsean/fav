version: 2
project_name: fav

before:
  hooks:
    - go mod tidy

builds:
  - id: tend
    main: ./cmd/fav
    binary: tend
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
  - id: fav-windows  # Windows has no symlink to install: fav.exe is the same program under its old name
    main: ./cmd/fav
    binary: fav
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - ids: [tend, fav-windows]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"  # no version in the name so releases/latest/download/<name> works
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs", "^chore", "^test"]

release:
  draft: false

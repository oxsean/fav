version: 2
project_name: tend

before:
  hooks:
    - go mod tidy

builds:
  - id: tend
    main: ./cmd/tend
    binary: tend
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
  - id: tend-server
    main: ./cmd/tend-server
    binary: tend-server
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - ids: [tend]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"  # no version in the name so releases/latest/download/<name> works
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE]
  - id: tend-server
    ids: [tend-server]
    formats: [tar.gz]
    name_template: "tend-server_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs", "^chore", "^test"]

release:
  draft: false
